{% extends "base.html" %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<div class="content-card text-center py-5">
    <div style="font-size: 4rem; font-weight: 800; color: #142B50;">404</div>
    <h2 class="card-title text-navy mt-2">Page Not Found</h2>
    <p class="card-subtitle mt-2 mb-4">The page or resource you are looking for does not exist.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary" style="display: inline-flex;">
        &larr; Return to Dashboard
    </a>
</div>
{% endblock %}
